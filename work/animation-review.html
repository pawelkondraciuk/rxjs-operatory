<!doctype html><html lang="pl"><meta charset="utf-8"><title>Przegląd animacji RxJS</title>
<style>body{margin:0;background:#faf7ed;color:#16232b;font-family:Arial}#screen{width:1280px;height:720px;box-sizing:border-box;padding:24px 32px}h2{font:bold 42px Georgia;margin:0;height:76px}nav{display:flex;gap:12px;position:fixed;bottom:12px;left:32px;right:32px}button,select{font:18px Arial;padding:8px}#report{position:absolute;top:600px;font:18px Arial}</style>
<div id="variants" hidden></div><main id="screen"><h2></h2><div class="rx-player"></div><output id="report"></output></main>
<nav><select aria-label="Scena"></select><button id="ready">Początek</button><button id="question">Pytanie</button><button id="finish">Koniec</button><button id="play">Odtwórz</button><button id="pause">Pauza</button><button id="audit">Sprawdź wszystkie kadry</button></nav>
<script type="module">
import {scenes} from '../animations/catalog.js';
import {prepareSlides} from '../animations/presentation.js';
import {createPlayer} from '../animations/player.js';
import '../animations/reveal.css';
const variants=document.querySelector('#variants');
variants.innerHTML=scenes.filter(s=>s.id!=='01-tytul').map(s=>`<section data-animation="${s.id}"><h2></h2><div class="rx-player"></div></section>`).join('');
const byId=prepareSlides(scenes),select=document.querySelector('select'),root=document.querySelector('#screen .rx-player'),heading=document.querySelector('#screen h2'),report=document.querySelector('#report');
select.innerHTML=[...variants.querySelectorAll('section')].map(s=>`<option value="${s.id}">${s.id} — ${byId.get(s.id).title}</option>`).join('');
let player;
function choose(){player?.pause();const scene=byId.get(select.value);heading.textContent=scene.title;player=createPlayer(root,scene);report.textContent='';}
select.addEventListener('change',choose);
document.querySelector('#ready').onclick=()=>player.seek(0);
document.querySelector('#question').onclick=()=>player.seek(player.stops.at(-1)?.time??player.duration/2);
document.querySelector('#finish').onclick=()=>player.finish();
document.querySelector('#play').onclick=()=>player.playContinuously();
document.querySelector('#pause').onclick=()=>player.pause();
document.querySelector('#audit').onclick=()=>{
 let frames=0;const issues=[];
 for(const option of select.options){select.value=option.value;choose();
  for(const t of [0,...player.stops.map(s=>s.time),player.duration]){
   player.seek(t);frames++;
   const svg=root.querySelector('svg'),box=svg.viewBox.baseVal;
   const texts=[...svg.querySelectorAll('text')].filter(t=>Number(t.closest('g')?.getAttribute('opacity')??1)>.8);
   for(const t of texts){const b=t.getBBox();if(b.x<-.5||b.y<-.5||b.x+b.width>box.width+.5||b.y+b.height>box.height+.5)issues.push(option.value+': '+t.textContent);}
  }
 }
 report.textContent=`${frames} kadrów; poza diagramem: ${issues.length}. ${[...new Set(issues)].join(' | ')}`;
};
choose();
</script></html>
